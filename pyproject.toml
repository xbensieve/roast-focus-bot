[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "roast-focus-bot"
version = "0.1.0"
description = "A lightweight Windows focus enforcement daemon with offline TTS"
requires-python = ">=3.12"
dependencies = [
  "PyGetWindow==0.0.9",
  "pyttsx3==2.99",
  "pynput==1.8.2",
]

[project.scripts]
roast-focus-bot = "roast_focus_bot.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
